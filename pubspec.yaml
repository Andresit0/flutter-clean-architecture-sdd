name: clean_architecture_sdd_harness
description: "Feature-first Flutter clean architecture template with Riverpod 3 codegen, Result-based domain layer, package wrappers, and an AI-assisted SDD/TDD/BDD harness with enterprise CI/CD."
publish_to: 'none' 
version: 1.1.2+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.3
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.6
  dio: ^5.11.0
  go_router: ^18.0.0
  freezed_annotation: ^3.1.0
  internet_connection_checker_plus: ^3.1.1
  json_annotation: ^4.12.0
  encrypt: ^5.0.3
  crypto: ^3.0.7
  sembast: ^3.7.5+2
  sembast_web: ^2.4.0+4
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dart_jsonwebtoken: ^3.1.1
  bcrypt: ^1.2.0
  flutter_jailbreak_detection_plus: ^1.10.7
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.1
  freezed: ^3.1.0
  mocktail: ^1.0.4
  riverpod_lint: ^3.1.4
  json_serializable: ^6.9.0
  gherkart: ^0.2.1
  test: ^1.25.0
  path_provider_platform_interface: ^2.1.3
  golden_toolkit: ^0.15.0
  yaml: ^3.1.3

flutter:
  generate: true
  uses-material-design: true

version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      riverpod:
        patterns:
          - "flutter_riverpod"
          - "riverpod_annotation"
          - "riverpod_generator"
          - "riverpod_lint"
      flutter-plugins:
        patterns:
          - "flutter_secure_storage"
          - "path_provider"
          - "path_provider_platform_interface"
          - "internet_connection_checker_plus"
          - "flutter_jailbreak_detection_plus"
      test-tooling:
        patterns:
          - "mocktail"
          - "test"
          - "gherkart"
          - "golden_toolkit"
          - "yaml"
      codegen:
        patterns:
          - "freezed"
          - "freezed_annotation"
          - "json_serializable"
          - "json_annotation"
          - "build_runner"
    ignore:
      # flutter_jailbreak_detection_plus has no iOS Swift Package Manager
      # support yet (Flutter warns it will become an error). Only accept
      # minor/patch via the auto-merge workflow.
      - dependency-name: "flutter_jailbreak_detection_plus"
        update-types: ["version-update:semver-major"]
      # intl is SDK-pinned: flutter_localizations (Flutter 3.47.4) requires
      # intl ^0.20.3, so pubspec.yaml pins intl ^0.20.3. Dependabot does NOT
      # honor ignore inside grouped updates (dependabot-core #10122/#13213), so
      # this ignore is defense-in-depth; the constraint plus CI are the real
      # guard. Revisit only if flutter_localizations widens its range.
      - dependency-name: "intl"
      # test is effectively SDK-pinned via test_api: flutter_test (Flutter
      # 3.47.4) pins test_api 0.7.12, and test 1.32.0 requires test_api 0.7.14.
      # Keep this ignore until the Flutter SDK bumps its test_api pin.
      - dependency-name: "test"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      riverpod:
        patterns:
          - "flutter_riverpod"
          - "riverpod_annotation"
          - "riverpod_generator"
          - "riverpod_lint"
      flutter-plugins:
        patterns:
          - "flutter_secure_storage"
          - "path_provider"
          - "path_provider_platform_interface"
          - "internet_connection_checker_plus"
          - "flutter_jailbreak_detection_plus"
      test-tooling:
        patterns:
          - "mocktail"
          - "test"
          - "gherkart"
          - "golden_toolkit"
          - "yaml"
      codegen:
        patterns:
          - "freezed"
          - "freezed_annotation"
          - "json_serializable"
          - "json_annotation"
          - "build_runner"
    ignore:
      # flutter_jailbreak_detection_plus has no iOS Swift Package Manager
      # support yet (Flutter warns it will become an error). Only accept
      # minor/patch via the auto-merge workflow.
      - dependency-name: "flutter_jailbreak_detection_plus"
        update-types: ["version-update:semver-major"]
      # intl is SDK-pinned: flutter_localizations (Flutter 3.44.0) pins intl
      # exactly to 0.20.2. pubspec.yaml exact-pins intl 0.20.2 so the pub solver
      # itself refuses a bump (Dependabot does NOT honor ignore inside grouped
      # updates — dependabot-core #10122/#13213 — the exact pin is the real
      # guard). This ignore is defense-in-depth. Bump the exact pin manually when
      # the Flutter SDK bumps its own pin, then remove this ignore.
      - dependency-name: "intl"
      # test is effectively SDK-pinned via test_api: flutter_test (Flutter
      # 3.44.0) pins test_api 0.7.11 exactly, and test 1.31.1+ requires
      # test_api 0.7.12. Remove this ignore when the Flutter SDK bumps its pin.
      - dependency-name: "test"
      # freezed 4.x is currently prerelease (4.0.0-dev.x). The codegen
      # toolchain bump to analyzer 13 (build_runner 2.16 / riverpod 4.0.8)
      # forces freezed 4.0.0-dev.3 — the ONLY freezed compatible with analyzer
      # 13, since no stable freezed supports it. Enterprise policy: do not
      # adopt prerelease-major codegen in production. Remove this ignore when
      # freezed 4.0.0 stable ships (tracked in issue #62).
      - dependency-name: "freezed"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

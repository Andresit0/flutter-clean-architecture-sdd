name: Deploy Web

# Publishes the Flutter Web build of `main` to GitHub Pages (Actions source).
# Runs automatically on every push to `main` (i.e. after each release merge),
# so the live demo always reflects the last officially released version.
#
# Model: GitHub Pages Artifact (configure-pages -> upload-pages-artifact ->
# deploy-pages). No `gh-pages` branch is maintained.
#
# One-time setup: Repository settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - name: Build Flutter web (demo config)
        run: |
          flutter build web --release \
            --base-href /flutter-clean-architecture-sdd/ \
            --dart-define=ENVIRONMENT=dev \
            --dart-define=API_HOST=tudesarrollador.com \
            --dart-define=API_USE_HTTPS=true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
